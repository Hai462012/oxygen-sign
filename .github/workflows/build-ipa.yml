name: Build Oxygen Sign Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project OxygenSign.xcodeproj -target OxygenSign -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OxygenSign.app Payload/
          zip -qry Oxygen-Sign-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Oxygen-Sign-Unsigned
          path: Oxygen-Sign-Unsigned.ipa
          if-no-files-found: error
